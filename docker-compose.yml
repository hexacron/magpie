services:
  magpie:
    build:
      context: .
      dockerfile: Dockerfile
    image: magpie:2.0.0
    container_name: magpie
    restart: unless-stopped
    env_file: .env
    # env_file entries override the image's ENV, so a .env written for local
    # use (MAGPIE_HOST=127.0.0.1, MAGPIE_DATA_DIR=./data) would make the container
    # unreachable and write outside the volume. Pin the container-side values.
    environment:
      MAGPIE_HOST: 0.0.0.0
      MAGPIE_PORT: 8099
      MAGPIE_DATA_DIR: /data
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - magpie-data:/data

    # --- Reverse-proxy deployment -------------------------------------
    # Do not expose this container directly on a public interface unless
    # MAGPIE_AUTH_TOKEN is set. To run it behind nginx/Caddy/Traefik on the
    # same host, bind the published port to loopback only:
    #
    #   ports:
    #     - "127.0.0.1:8099:8099"
    #
    # Or drop `ports:` entirely, join the proxy's network, and let the
    # proxy reach the service by name on port 8099:
    #
    #   expose:
    #     - "8099"
    #   networks:
    #     - web
    #
    # If the proxy terminates TLS and adds X-Forwarded-*, set
    # MAGPIE_TRUST_PROXY=1 in .env, and MAGPIE_BASE_PATH=/magpie when it is mounted
    # under a subpath.
    # ------------------------------------------------------------------

# networks:
#   web:
#     external: true

  # Continuous monitoring of the persisted watchlist. Shares the same volume
  # as the web service, so posts it collects are immediately queryable and
  # browsable there. Manage the watchlist with:
  #   docker compose exec monitor magpie watchlist add @Reuters @AFP
  #   docker compose exec monitor magpie watchlist tune
  # Deliver new posts somewhere by setting MAGPIE_NOTIFY in .env, e.g.
  #   MAGPIE_NOTIFY=webhook:https://hooks.example.com/x
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: magpie:2.0.0
    container_name: magpie-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      MAGPIE_DATA_DIR: /data
    volumes:
      - magpie-data:/data
    command: >
      sh -c 'magpie monitor
      --notify "file:/data/new-posts.jsonl"
      ${MAGPIE_NOTIFY:+--notify "$MAGPIE_NOTIFY"}'
    depends_on:
      - magpie
    # The image's HEALTHCHECK curls /healthz, which only the web service
    # serves, so the monitor would report `unhealthy` forever. Check the thing
    # that actually indicates this daemon works: every watched account polled
    # within a grace multiple of its own interval.
    healthcheck:
      test: ["CMD", "magpie", "health"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  magpie-data:
